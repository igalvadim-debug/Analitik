const typeColor={
  "Wohnung":"background:#e6f1fb;color:#185fa5",
  "Haus":"background:#eaf3de;color:#3b6d11",
  "Gewerbe":"background:#faeeda;color:#854f0b",
  "Erbbaurecht":"background:#fbeaf0;color:#993556",
  "Lager":"background:#f1efe8;color:#5f5e5a",
  "Info":"background:#f1efe8;color:#5f5e5a"
};
const riskLabel={"low":"Низкий риск","med":"Средний риск","high":"Высокий риск"};

function fmtPrice(v){
  if(!v) return "—";
  if(v>=1000000) return (v/1000000).toFixed(2).replace(/\.?0+$/,"")+" Mio €";
  return (v/1000).toFixed(0)+" k€";
}

function render(){
  const typeF=document.getElementById("f-type").value;
  const riskF=document.getElementById("f-risk").value;
  const sortF=document.getElementById("f-sort").value;
  const search=document.getElementById("f-search").value.toLowerCase();
  let data=[...DATA];
  if(typeF) data=data.filter(d=>d.type===typeF);
  if(riskF) data=data.filter(d=>d.risk===riskF);
  if(search) data=data.filter(d=>(d.addr+d.bezirk).toLowerCase().includes(search));
  if(sortF==="asc") data.sort((a,b)=>(a.vw||0)-(b.vw||0));
  else if(sortF==="desc") data.sort((a,b)=>(b.vw||0)-(a.vw||0));
  else data.sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById("s-total").textContent=data.length;
  const prices=data.filter(d=>d.vw>0).map(d=>d.vw);
  document.getElementById("s-min").textContent=prices.length?fmtPrice(Math.min(...prices)):"—";
  document.getElementById("s-max").textContent=prices.length?fmtPrice(Math.max(...prices)):"—";
  const dates=data.filter(d=>d.date&&d.date!=="2026-?").map(d=>d.date).sort();
  document.getElementById("s-next").textContent=dates.length?dates[0].replace("2026-",""):"—";
  const grid=document.getElementById("grid");
  const noR=document.getElementById("no-results");
  if(!data.length){grid.innerHTML="";noR.style.display="block";return;}
  noR.style.display="none";
  grid.innerHTML=data.map(d=>{
    const rc=d.risk==="low"?"risk-low":d.risk==="med"?"risk-med":"risk-high";
    const tc=typeColor[d.type]||typeColor["Info"];
    const prosH=d.pros.map(p=>`<li>&#10003; ${p}</li>`).join("");
    const consH=d.cons.slice(0,3).map(c=>`<li>&#10007; ${c}</li>`).join("");
    return `<div class="card">
<div class="card-head">
  <div>
    <div class="card-id"># ${d.id}</div>
    <div class="card-addr">${d.addr}</div>
    <div class="card-sub">${d.bezirk}</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
    <span class="card-type" style="${tc}">${d.type}</span>
    <span class="date-badge">&#128197; ${d.date.replace("2026-","").replace("?","TBD")}</span>
  </div>
</div>
<div class="card-price">${fmtPrice(d.vw)}<span style="font-size:13px;color:#888780;font-weight:400;margin-left:6px">Verkehrswert</span></div>
<div class="card-row">
  ${d.wfl?`<span class="pill">${d.wfl} m&sup2;</span>`:""}
  ${d.rooms?`<span class="pill">${d.rooms} Zi.</span>`:""}
  ${d.bj?`<span class="pill">Bj. ${d.bj}</span>`:""}
</div>
<div class="risk-row">
  <span class="risk-badge ${rc}">${riskLabel[d.risk]}</span>
  <span style="font-size:11px;color:#888780">Bid: <b style="color:#1a1a18">${d.bid}</b></span>
</div>
<div class="pros-cons">
  <div><div class="pc-label">Плюсы</div><ul class="pc-list">${prosH}</ul></div>
  <div><div class="pc-label">Минусы</div><ul class="pc-list">${consH}</ul></div>
</div>
<div class="fin-block">
  <div class="fin-row"><span class="fin-label">Аренда</span><span>${d.miete}</span></div>
  <div class="fin-row"><span class="fin-label">Доходность</span><span>${d.yld}</span></div>
  <div class="fin-row"><span class="fin-label">Ликвидность</span><span>${d.liqui}</span></div>
  <div class="fin-row"><span class="fin-label">Риски</span><span style="text-align:right;max-width:180px">${d.risks}</span></div>
</div>
<div class="verdict">${d.verdict}</div>
<div class="sources">
  <span class="${d.beschluss?"src-yes":"src-no"}">Beschluss ${d.beschluss?"✓":"✗"}</span>
  <span class="${d.gutachten?"src-yes":"src-no"}">Gutachten ${d.gutachten?"✓":"✗"}</span>
</div>
</div>`;
  }).join("");
}

render();
</script>
