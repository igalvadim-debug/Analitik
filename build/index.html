document.getElementById("grid").innerHTML=data.map(d=>`<div class="card"><div class="card-head"><span class="card-id">#${d.id}</span><span class="card-type" style="${typeColor[d.type]||typeColor["Sonstiges"]}">${d.type||"?"}</span></div><div class="card-addr">${d.addr||"Unbekannt"}</div><div class="card-sub">${d.bezirk||""}${d.wfl?" · "+d.wfl+" m²":""}${d.rooms?" · "+d.rooms+" Zi":""}${d.bj?" · BJ "+d.bj:""}</div>${(d.photos||[]).length?`<div class="card-photos">${d.photos.map(p=>`<img src="${p}" alt="Foto" loading="lazy">`).join("")}</div>`:""}<div class="card-price">${fmtPrice(d.vw)} <span class="date-badge">${d.date||"?"}</span></div><div class="risk-row"><span class="risk-badge risk-${d.risk||"med"}">${riskLabel[d.risk]||d.risk}</span><span class="date-badge">${d.discount||""}</span></div>${(d.pros||[]).length||(d.cons||[]).length?`<div class="pros-cons"><div><div class="pc-label">Pro</div><ul class="pc-list">${(d.pros||[]).map(p=>`<li>+ ${p}</li>`).join("")}</ul></div><div><div class="pc-label">Contra</div><ul class="pc-list">${(d.cons||[]).map(c=>`<li>− ${c}</li>`).join("")}</ul></div></div>`:""}<div class="fin-block"><div class="fin-row"><span class="fin-label">Marktpreis</span><span>${d.markt||"—"}</span></div><div class="fin-row"><span class="fin-label">Miete</span><span>${d.miete||"—"}</span></div><div class="fin-row"><span class="fin-label">Rendite</span><span>${d.yld||"—"}</span></div><div class="fin-row"><span class="fin-label">Liquiditaet</span><span>${d.liqui||"—"}</span></div><div class="fin-row"><span class="fin-label">Risiken</span><span style="text-align:right;max-width:180px">${d.risks||"—"}</span></div></div><div class="verdict">${d.verdict||""}</div><div class="sources"><span class="${d.beschluss?"src-yes":"src-no"}">Beschluss ${d.beschluss?"OK":"—"}</span><span class="${d.gutachten?"src-yes":"src-no"}">Gutachten ${d.gutachten?"OK":"—"}</span></div></div>`).join("");
document.getElementById("no-results").style.display=data.length?"none":"block";
const vws=data.map(d=>d.vw).filter(v=>v);if(vws.length){document.getElementById("s-min").textContent=fmtPrice(Math.min(...vws));document.getElementById("s-max").textContent=fmtPrice(Math.max(...vws))}
const dates=data.map(d=>d.date).filter(d=>d&&d!=="unbekannt").sort();if(dates.length)document.getElementById("s-next").textContent=dates[0]
}
render();
</script>
</body>
</html>
